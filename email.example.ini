# Copy this file to email.ini and fill it in. email.ini is git-ignored.
#
# Common SMTP servers:
#   Gmail:    host = smtp.gmail.com     port = 587  security = starttls
#             (needs 2-Step Verification + an App Password: https://myaccount.google.com/apppasswords)
#   Yahoo:    host = smtp.mail.yahoo.com port = 465 security = ssl   (App Password)
#   Zoho:     host = smtp.zoho.com      port = 465  security = ssl
#   Outlook/Hotmail/Live personal accounts no longer accept SMTP passwords, so use
#   one of the above as the *sender*. Any address can be a recipient.

[smtp]
host = smtp.gmail.com
port = 587
# starttls | ssl | none
security = starttls
user = your.account@gmail.com
# Or leave empty and set the ANTICAT_SMTP_PASSWORD environment variable
password =

[email]
# Defaults to the smtp user
from = your.account@gmail.com
# One or more recipients, comma separated
to = someone@example.com, another@example.com
subject = Anticat: cat detected
# Minimum seconds between emails
cooldown = 60
